<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214" />
    <!-- Before any CSS paints: apply the saved theme so dark mode never flashes light. Same as themeScript(). -->
    <script>(function(){try{var t=localStorage.getItem("lui-theme")||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.dataset.theme=t;r.classList.toggle('dark',d)}catch(e){}})()</script>
    <title>Lightweight UI · Playground</title>

  </head>

    <div id="root"></div>
