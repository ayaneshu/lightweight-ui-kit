# When main gets a version that hasn't been released yet, tag it (v1.2.3) and
# publish a GitHub release whose notes are that version's CHANGELOG.md section.
# Anyone can then install exactly that version:
#   npm install github:ayaneshu/lightweight-ui-kit#v1.2.3
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          node scripts/changelog.mjs notes "$version" > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md --latest
